<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>টুর্নামেন্ট ম্যানেজার</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e2e6ea;--ac:#16a34a;--act:#fff;--soft:#e8f6ee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1217;--card:#171d25;--tx:#eef1f5;--mu:#98a2b3;--bd:#29313c;--ac:#22c55e;--act:#04210f;--soft:#12301e}}
:root[data-theme="dark"]{--bg:#0e1217;--card:#171d25;--tx:#eef1f5;--mu:#98a2b3;--bd:#29313c;--ac:#22c55e;--act:#04210f;--soft:#12301e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans Bengali","Hind Siliguri",sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:14px;margin:8px 0 0}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri,button.on{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.45}
.big{width:100%;padding:14px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--soft);border-radius:99px;padding:6px 8px 6px 12px;font-size:15px}
.chip b{margin-left:8px;cursor:pointer;color:var(--mu);padding:0 4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500}td.n{text-align:left}th.n{text-align:left}
tr.first td{font-weight:700;color:var(--ac)}
.rd{font-size:13px;color:var(--mu);margin:14px 0 6px;font-weight:600}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.m:last-child{border:0}.m .a{text-align:right}.m .b{text-align:left}
.m span.w{font-weight:700;color:var(--ac)}
.sc{display:flex;align-items:center;gap:4px}
.sc input{width:44px;padding:8px 2px;text-align:center;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.pen{grid-column:1/-1;display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;color:var(--mu)}
.pen button{padding:5px 10px;font-size:13px}
.bye{grid-column:1/-1;text-align:center;color:var(--mu);font-size:14px}
.champ{background:var(--ac);color:var(--act);text-align:center;font-size:18px;font-weight:700;border-radius:14px;padding:14px;margin-bottom:12px}
.rest{font-size:13px;color:var(--mu);margin-top:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.lb{font-size:12px;color:var(--mu);margin-top:8px}.agg{text-align:center;font-size:13px;color:var(--mu);padding:4px 0}select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;margin:8px 0}.mm{border-bottom:1px solid var(--bd);padding-bottom:8px;margin-bottom:6px}.mm:last-child{border:0}.zg td:first-child{box-shadow:inset 4px 0 0 var(--ac)}.zr td:first-child{box-shadow:inset 4px 0 0 #ef4444}.dv{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.dv button{white-space:nowrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.lgd{font-size:13px;color:var(--mu);margin:8px 0 0}.zr2{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px}.zr2 input{width:70px;padding:8px;text-align:center;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}.ov i{position:absolute;top:-30px;border-radius:2px;opacity:.9;animation:fall linear infinite}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}.cb{position:relative;background:var(--card);color:var(--tx);border-radius:20px;padding:26px 20px 20px;text-align:center;max-width:340px;width:100%;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.3);opacity:0}}.tr{font-size:84px;line-height:1;animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}.cb h2{font-size:22px;margin:10px 0 4px}.cn{font-size:28px;font-weight:800;color:var(--ac);word-break:break-word}.pz{margin:12px 0;padding:10px;border-radius:12px;background:var(--soft);font-weight:600}.cb .big{margin-top:12px}.champ button{margin-top:8px;background:transparent;color:var(--act);border-color:var(--act);padding:6px 12px}@media (prefers-reduced-motion:reduce){.ov i,.tr,.cb{animation:none}}</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nd=(i,m)=>({name:'ডিভিশন '+(i+1),players:[],fmt:m==='div'?'league':'lk',league:[],ko:[],tab:'ko',q:0,zu:m==='div'?2:0,zd:m==='div'?2:0,st:false,season:1,ended:false,res:null,inc:[],hist:[],prize:'',cel:''});
let S={mode:'',divs:[nd(0,'tour')],cur:0};
try{const x=localStorage.getItem('tm5');if(x)S=JSON.parse(x)}catch(e){}
const D=()=>S.divs[S.cur];
function withDiv(i,f){const c=S.cur;S.cur=i;try{return f()}finally{S.cur=c}}
function save(){try{localStorage.setItem('tm5',JSON.stringify(S))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function add(){const el=$('#nm'),v=el.value.trim(),P=D().players;if(!v||S.divs.some(d=>d.players.concat(d.inc).some(p=>p.toLowerCase()===v.toLowerCase()))){el.focus();return}P.push(v);R();$('#nm').focus()}
function del(i){D().players.splice(i,1);R()}
function setFmt(f){D().fmt=f;R()}
function setName(v){D().name=v.trim()||D().name;R()}
function setZ(f,v){D()[f]=Math.max(0,parseInt(v)||0);R()}
function selDiv(i){S.cur=i;R()}
function addDiv(){S.divs.push(nd(S.divs.length,S.mode));S.cur=S.divs.length-1;R()}
function delDiv(){if(S.divs.length<2||D().st)return;S.divs.splice(S.cur,1);S.cur=0;R()}
function size(n){let s=2;while(s<n)s*=2;return s}
function genLeague(p){let t=p.slice();if(t.length%2)t.push(null);const n=t.length,m=[];
for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)m.push({r:r+1,a,b,sa:'',sb:''})}t.splice(1,0,t.pop())}return m}
function seedOrder(sz){let a=[1];while(a.length<sz){const n=a.length*2;a=a.flatMap(s=>[s,n+1-s])}return a}
function genKO(list){const n=list.length,sz=size(n),o=seedOrder(sz).map(s=>s<=n?list[s-1]:'BYE'),rounds=[];
const mk=()=>({l1a:'',l1b:'',l2a:'',l2b:'',pw:''});
const r0=[];for(let i=0;i<sz/2;i++){r0.push({a:o[2*i],b:o[2*i+1],...mk()})}rounds.push(r0);
for(let c=sz/4;c>=1;c/=2)rounds.push(Array.from({length:c},mk));return rounds}
function initDiv(d,p){d.players=p;d.league=[];d.ko=[];d.tab='ko';d.q=p.length;if(d.fmt==='ko')d.ko=genKO(shuffle(p));else d.league=genLeague(shuffle(p))}
function start(){const d=D();initDiv(d,d.players);d.st=true;d.season=1;d.hist=[];R()}
function startKO(){const d=D();d.ko=genKO(table().slice(0,d.q||d.players.length).map(x=>x.p));d.tab='ko';R()}
function reset(){const d=D();d.st=false;d.league=[];d.ko=[];d.ended=false;d.res=null;R()}
function num(v){return v===''?'':Math.max(0,parseInt(v)||0)}
function setL(i,f,v){D().league[i][f]=num(v);R()}
function setK(r,i,f,v){D().ko[r][i][f]=f==='pw'?v:num(v);if(f!=='pw')D().ko[r][i].pw='';R()}
function setQ(v){D().q=+v;R()}
function setTab(t){D().tab=t;R()}
function table(){const d=D(),t={};d.players.forEach(p=>t[p]={p,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
d.league.forEach(m=>{if(m.sa===''||m.sb==='')return;const a=t[m.a],b=t[m.b];a.P++;b.P++;a.GF+=m.sa;a.GA+=m.sb;b.GF+=m.sb;b.GA+=m.sa;
if(m.sa>m.sb){a.W++;b.L++;a.Pts+=3}else if(m.sa<m.sb){b.W++;a.L++;b.Pts+=3}else{a.D++;b.D++;a.Pts++;b.Pts++}});
return Object.values(t).sort((x,y)=>y.Pts-x.Pts||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF||x.p.localeCompare(y.p))}
const legs=r=>D().ko[r].length===1?1:2;
function teams(r,i){if(r===0){const m=D().ko[0][i];return[m.a,m.b]}return[win(r-1,2*i),win(r-1,2*i+1)]}
function done(m,L){return L===2?[m.l1a,m.l1b,m.l2a,m.l2b].every(x=>x!==''):m.l1a!==''&&m.l1b!==''}
function agg(m,L){return[m.l1a+(L===2?m.l2a:0),m.l1b+(L===2?m.l2b:0)]}
function win(r,i){const[a,b]=teams(r,i),m=D().ko[r][i],L=legs(r);
if(a==='BYE'&&b==='BYE')return'BYE';if(a==='BYE')return b;if(b==='BYE')return a;
if(!a||!b||!done(m,L))return null;const[x,y]=agg(m,L);
if(x>y)return a;if(y>x)return b;return m.pw==='a'?a:m.pw==='b'?b:null}
function rname(r){const t=D().ko[r].length*2;return t===2?'ফাইনাল (১ লেগ)':t===4?'সেমিফাইনাল (২ লেগ)':t===8?'কোয়ার্টার ফাইনাল (২ লেগ)':`রাউন্ড অব ${t} (২ লেগ)`}
function champ(){const d=D();if(d.fmt==='league')return d.league.length&&leagueDone()?table()[0].p:null;
if(!d.ko.length)return null;const w=win(d.ko.length-1,0);return w&&w!=='BYE'?w:null}
const banner=n=>`<div class="champ">🏆 চ্যাম্পিয়ন: ${esc(n)}${D().prize?`<div style="font-size:15px;font-weight:600;margin-top:4px">🎁 প্রাইজ: ${esc(D().prize)}</div>`:''}<button onclick="replay()">🎉 আবার দেখুন</button></div>`;
function celKey(){const n=champ();return n?S.cur+'|'+D().season+'|'+n:''}
function overlay(){const d=D(),n=champ();if(!n||d.cel===celKey())return'';const c=['#f43f5e','#f59e0b','#22c55e','#3b82f6','#a855f7','#eab308'];let f='';
for(let i=0;i<60;i++){const z=6+Math.random()*8;f+=`<i style="left:${Math.random()*100}%;background:${c[i%6]};width:${z}px;height:${z*1.6}px;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*2.5}s"></i>`}
return`<div class="ov">${f}<div class="cb"><div class="tr">🏆</div><h2>🎉 অভিনন্দন! 🎉</h2><div class="cn">${esc(n)}</div><p class="mu">${S.mode==='div'?esc(d.name)+' · সিজন '+d.season+' চ্যাম্পিয়ন':'টুর্নামেন্ট চ্যাম্পিয়ন'}</p>${d.prize?`<div class="pz">🎁 প্রাইজ: ${esc(d.prize)}</div>`:''}<button class="pri big" onclick="closeCel()">ঠিক আছে</button></div></div>`}
function closeCel(){D().cel=celKey();R()}
function replay(){D().cel='';R()}
function setPrize(v){D().prize=v.trim();R()}
const leagueDone=()=>D().league.every(m=>m.sa!==''&&m.sb!=='');
function chooseMode(m){S.mode=m;S.cur=0;S.divs=[nd(0,m)];R()}
function home(){S.mode='';R()}
function endSeason(){const i=S.cur,d=D(),t=table().map(x=>x.p),n=S.divs.length;
const up=i>0?t.slice(0,Math.min(d.zu,t.length)):[],dn=i<n-1?t.slice(t.length-Math.min(d.zd,t.length-up.length)):[];
d.hist.push({s:d.season,c:t[0],up,dn});d.res={up,dn,keep:t.filter(p=>!up.includes(p)&&!dn.includes(p))};d.ended=true;
if(up.length)S.divs[i-1].inc.push(...up);if(dn.length)S.divs[i+1].inc.push(...dn);R()}
function newSeason(){const d=D(),p=d.res.keep.concat(d.inc);if(p.length<2)return;d.inc=[];d.season++;d.ended=false;d.res=null;initDiv(d,p);R()}
function divTabs(x){return`<div class="dv">${S.divs.map((d,i)=>`<button class="${i===S.cur?'on':''}" onclick="selDiv(${i})">${esc(d.name)}</button>`).join('')}${x||''}</div>`}
const zi=(f,v)=>`<input type="number" min="0" inputmode="numeric" value="${v}" onchange="setZ('${f}',this.value)">`;
function homeV(){return`<h1>⚽ টুর্নামেন্ট ম্যানেজার</h1><div class="card"><h2>🏆 লিগ / নকআউট টুর্নামেন্ট</h2><p class="mu" style="margin-top:0">আগে লিগ টেবিল, তারপর ২ লেগের নকআউট ও ১ লেগের ফাইনাল।</p><button class="pri big" onclick="chooseMode('tour')">এটা বেছে নিন</button></div>
<div class="card"><h2>🏅 ডিভিশন সিস্টেম</h2><p class="mu" style="margin-top:0">ডিভিশন ১, ২, ৩… প্রতিটির আলাদা লিগ। সিজন শেষে কোয়ালিফাই/প্রমোশনের টিম উপরের ডিভিশনে, রেলিগেশনের টিম নিচের ডিভিশনে যায়।</p><button class="pri big" onclick="chooseMode('div')">এটা বেছে নিন</button></div>`}
function setup(){const d=D(),n=d.players.length,last=S.cur===S.divs.length-1,dv=S.mode==='div';let h='';
if(n<2)h='কমপক্ষে ২ জন প্লেয়ার লাগবে।';
else if(d.fmt==='league')h=`${n*(n-1)/2}টি ম্যাচ। জয় ৩, ড্র ১ পয়েন্ট।`;
else if(d.fmt==='ko')h=`${size(n)}-এর ব্র্যাকেট, ফাইনাল বাদে সব রাউন্ডে ২ লেগ।`;
else h=`আগে লিগ (${n*(n-1)/2}টি ম্যাচ), শেষে সেরাদের নিয়ে নকআউট: ফাইনাল বাদে ২ লেগ, ফাইনাল ১ লেগ।`;
const f=(k,t)=>`<button class="${d.fmt===k?'on':''}" onclick="setFmt('${k}')">${t}</button>`;
const fm=dv?`<div class="card"><h2>কোয়ালিফাই ও রেলিগেশন</h2><p class="mu" style="margin:0">${h}</p><div class="zr2"><span>${S.cur===0?'কোয়ালিফাই':'প্রমোশন (উপরের ডিভিশনে)'} · টপ কতজন</span>${zi('zu',d.zu)}</div>${last?'':`<div class="zr2"><span>রেলিগেশন (নিচের ডিভিশনে) · বটম কতজন</span>${zi('zd',d.zd)}</div>`}</div>`
:`<div class="card"><h2>ফরম্যাট</h2><div style="display:grid;gap:8px">${f('lk','লিগ + নকআউট')}${f('league','শুধু লিগ')}${f('ko','শুধু নকআউট')}</div><p class="mu">${h}</p></div>`;
return`<div class="top"><h1>${dv?'🏅 ডিভিশন সিস্টেম':'🏆 টুর্নামেন্ট'}</h1>${S.divs.some(x=>x.st)?'':'<button onclick="home()">← মোড</button>'}</div>${dv?divTabs('<button onclick="addDiv()">+ ডিভিশন</button>'):''}
${dv?`<div class="card"><h2>ডিভিশনের নাম</h2><div class="row"><input id="dn" type="text" maxlength="24" value="${esc(d.name)}" onchange="setName(this.value)">${S.divs.length>1?'<button onclick="delDiv()">🗑</button>':''}</div></div>`:''}
<div class="card"><h2>প্লেয়ার যোগ করুন</h2><div class="row"><input id="nm" type="text" maxlength="20" placeholder="প্লেয়ারের নাম" onkeydown="if(event.key==='Enter')add()"><button class="pri" onclick="add()">যোগ</button></div>
<div class="chips">${d.players.map((p,i)=>`<span class="chip">${esc(p)}<b onclick="del(${i})">×</b></span>`).join('')}</div><p class="mu">মোট ${n} জন প্লেয়ার</p></div>
<div class="card"><h2>🎁 চ্যাম্পিয়নের প্রাইজ (ঐচ্ছিক)</h2><div class="row"><input id="pz" type="text" maxlength="40" placeholder="যেমন: ৫০০ টাকা / ট্রফি" value="${esc(d.prize||'')}" onchange="setPrize(this.value)"></div></div>
${fm}<button class="pri big" onclick="start()" ${n<2?'disabled':''}>${dv?'এই ডিভিশনের সিজন শুরু করুন':'টুর্নামেন্ট শুরু করুন'}</button>`}
function si(v,fn){return`<input type="number" min="0" inputmode="numeric" value="${v}" onchange="${fn}">`}
function playL(){const d=D(),t=table(),all=leagueDone(),n=d.players.length,last=S.cur===S.divs.length-1,zu=d.zu,zd=last?0:d.zd;
const rs=[...new Set(d.league.map(m=>m.r))];
let h=all&&d.fmt==='league'?banner(t[0].p):'';
if(all&&d.fmt==='lk'&&!d.ko.length){const q=d.q||n,opts=[n];for(let k=size(n)/2;k>=2;k/=2)if(k<n)opts.push(k);
h+=`<div class="card"><h2>লিগ শেষ ✅</h2><p class="mu" style="margin-top:0">কতজন নকআউটে উঠবে?</p><select onchange="setQ(this.value)">${opts.map(o=>`<option value="${o}" ${o===q?'selected':''}>${o===n?'সবাই ('+n+' জন)':'টপ '+o}</option>`).join('')}</select><button class="pri big" onclick="startKO()">নকআউট শুরু করুন</button></div>`}
h+=`<div class="card"><h2>পয়েন্ট টেবিল</h2><div class="tw"><table><tr><th class="n">প্লেয়ার</th><th>খে</th><th>জ</th><th>ড্র</th><th>হা</th><th>গোল</th><th>GD</th><th>পয়েন্ট</th></tr>
${t.map((x,i)=>`<tr class="${i<zu?'zg':i>=n-zd?'zr':''}"><td class="n">${i+1}. ${esc(x.p)}</td><td>${x.P}</td><td>${x.W}</td><td>${x.D}</td><td>${x.L}</td><td>${x.GF}:${x.GA}</td><td>${x.GF-x.GA}</td><td><b>${x.Pts}</b></td></tr>`).join('')}</table></div>
${zu?`<div class="lgd"><span class="dot" style="background:var(--ac)"></span>${S.cur===0?'কোয়ালিফাই':'প্রমোশন'} (টপ ${zu})</div>`:''}${zd?`<div class="lgd"><span class="dot" style="background:#ef4444"></span>রেলিগেশন (বটম ${zd})</div>`:''}</div>
<div class="card"><h2>ম্যাচ ও রেজাল্ট</h2>`;
rs.forEach(r=>{const ms=d.league.map((m,i)=>[m,i]).filter(x=>x[0].r===r);const pl=new Set();ms.forEach(([m])=>{pl.add(m.a);pl.add(m.b)});const rest=d.players.filter(p=>!pl.has(p));
h+=`<div class="rd">রাউন্ড ${r}</div>`+ms.map(([m,i])=>`<div class="m"><div class="a">${esc(m.a)}</div><div class="sc">${si(m.sa,`setL(${i},'sa',this.value)`)}–${si(m.sb,`setL(${i},'sb',this.value)`)}</div><div class="b">${esc(m.b)}</div></div>`).join('')+(rest.length?`<div class="rest">বিশ্রামে: ${rest.map(esc).join(', ')}</div>`:'')});
return h+'</div>'}
function row(h,a,x,y,fx,fy,ok){return`<div class="m"><div class="a">${h}</div><div class="sc">${ok?si(x,fx)+'–'+si(y,fy):'vs'}</div><div class="b">${a}</div></div>`}
function playK(){const K=D().ko,RN=K.length,fw=win(RN-1,0);
let h=fw&&fw!=='BYE'?banner(fw):'';
K.forEach((round,r)=>{const L=legs(r);h+=`<div class="card"><h2>${rname(r)}</h2>`+round.map((m,i)=>{const[a,b]=teams(r,i),w=win(r,i);
const nm=x=>x==null?'<span class="mu">—</span>':esc(x);
if(a==='BYE'||b==='BYE')return`<div class="mm"><div class="bye">${nm(a==='BYE'?b:a)} — বাই (সরাসরি পরের রাউন্ডে)</div></div>`;
const ok=a&&b,A=nm(a),B=nm(b),g=f=>`setK(${r},${i},'${f}',this.value)`;
let x=`<div class="mm"><div class="lb">${L===2?'প্রথম লেগ':'ফাইনাল'}</div>`+row(A,B,m.l1a,m.l1b,g('l1a'),g('l1b'),ok);
if(L===2)x+=`<div class="lb">দ্বিতীয় লেগ</div>`+row(B,A,m.l2b,m.l2a,g('l2b'),g('l2a'),ok);
if(ok&&done(m,L)){const[p,q]=agg(m,L);x+=`<div class="agg">${L===2?'মোট':'ফল'}: ${esc(a)} ${p} – ${q} ${esc(b)}${w?` · বিজয়ী: <b>${esc(w)}</b>`:''}</div>`;
if(p===q)x+=`<div class="pen">ড্র! পেনাল্টি/এক্সট্রা টাইমে বিজয়ী: <button class="${m.pw==='a'?'on':''}" onclick="setK(${r},${i},'pw','a')">${esc(a)}</button><button class="${m.pw==='b'?'on':''}" onclick="setK(${r},${i},'pw','b')">${esc(b)}</button></div>`}
return x+'</div>'}).join('')+'</div>'});
return h}
function play(){const d=D(),dv=S.mode==='div',both=d.league.length&&d.ko.length,k=both?d.tab!=='lg':!!d.ko.length,P=S.divs[S.cur-1],N=S.divs[S.cur+1];
let h=`<div class="top"><h1>${dv?esc(d.name)+' · সিজন '+d.season:'🏆 টুর্নামেন্ট'}</h1><button onclick="reset()">${dv?'রিসেট':'নতুন টুর্নামেন্ট'}</button></div>`+(dv?divTabs('<button onclick="addDiv()">+ ডিভিশন</button>'):'');
if(dv){if(d.inc.length)h+=`<div class="card"><h2>পরের সিজনে আসছে</h2><p class="mu" style="margin:0">${d.inc.map(esc).join(', ')}</p></div>`;
if(d.ended){const r=d.res;h+=`<div class="card"><h2>সিজন ${d.season} শেষ ✅</h2><p class="mu" style="margin-top:0">${r.up.length?`⬆️ ${esc(P.name)}-এ উঠেছে: <b>${r.up.map(esc).join(', ')}</b><br>`:''}${r.dn.length?`⬇️ ${esc(N.name)}-এ নেমেছে: <b>${r.dn.map(esc).join(', ')}</b><br>`:''}থাকছে: ${r.keep.map(esc).join(', ')||'—'}</p>${r.keep.length+d.inc.length<2?'<p class="mu">নতুন সিজনের জন্য কমপক্ষে ২ জন লাগবে। অন্য ডিভিশনের সিজন শেষ হলে টিম আসবে।</p>':''}<button class="pri big" onclick="newSeason()" ${r.keep.length+d.inc.length<2?'disabled':''}>নতুন সিজন শুরু করুন</button></div>`}
else if(leagueDone())h+=`<div class="card"><h2>লিগ শেষ ✅</h2><p class="mu" style="margin-top:0">${d.zu&&P?`টপ ${d.zu} জন ${esc(P.name)}-এ উঠবে। `:''}${d.zd&&N?`বটম ${d.zd} জন ${esc(N.name)}-এ নামবে।`:''}</p><button class="pri big" onclick="endSeason()">সিজন শেষ করুন</button></div>`}
if(both)h+=`<div class="tabs"><button class="${k?'on':''}" onclick="setTab('ko')">নকআউট</button><button class="${k?'':'on'}" onclick="setTab('lg')">লিগ টেবিল</button></div>`;
h+=k?playK():playL();
if(d.hist.length)h+=`<div class="card"><h2>আগের সিজন</h2>${d.hist.slice().reverse().map(x=>`<div class="rest">সিজন ${x.s}: 🏆 ${esc(x.c)}${x.up.length?' · ⬆️ '+x.up.map(esc).join(', '):''}${x.dn.length?' · ⬇️ '+x.dn.map(esc).join(', '):''}</div>`).join('')}</div>`;
return h+overlay()}
function R(){save();$('#app').innerHTML=!S.mode?homeV():D().st?play():setup()}
R();
</script></body></html>
