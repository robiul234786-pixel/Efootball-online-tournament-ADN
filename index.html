/* ===== Modern skin ===== */
:root{--bg:#eaf0fb;--card:#fff;--bd:#e3e9f4;--soft:#e6f7ec;--sh:0 6px 22px rgba(30,60,120,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#141d33;--bd:#222e4a;--tx:#f1f5ff;--mu:#93a0bd;--soft:#12301e;--sh:0 6px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#141d33;--bd:#222e4a;--tx:#f1f5ff;--mu:#93a0bd;--soft:#12301e;--sh:0 6px 22px rgba(0,0,0,.35)}
body{background:var(--bg);letter-spacing:.1px}
h1{font-size:24px;font-weight:800}
.card{border:0;border-radius:22px;padding:16px;box-shadow:var(--sh)}
button{border:0;border-radius:14px;background:var(--soft);color:var(--tx);box-shadow:none;transition:transform .12s}
button:active{transform:scale(.96)}
button.pri,button.on{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.35)}
.seg,.tabs{background:var(--bd);padding:4px;border-radius:16px;gap:4px}
.seg button,.tabs button{background:transparent;border-radius:12px}
.seg button.on,.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.15)}
input[type=text],select{border:2px solid transparent;background:var(--bg);border-radius:14px}
input[type=text]:focus,select:focus{outline:0;border-color:var(--ac)}
.dv button,.chipsr button{border-radius:99px;background:var(--card);box-shadow:var(--sh)}
.dv button.on,.chipsr button.on{background:linear-gradient(135deg,#22c55e,#16a34a)}
/* hero */
.hero{background:linear-gradient(145deg,#2563eb,#1d3fae 55%,#111c52);border-radius:26px;box-shadow:0 14px 34px rgba(37,99,235,.35)}
.stats div{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border-radius:16px}
.tile,.tcard{border:0;box-shadow:var(--sh);border-radius:20px;background:var(--card)}
.tcard.act{box-shadow:0 0 0 2px var(--ac),var(--sh)}
/* table */
table{border-collapse:separate;border-spacing:0 6px}
th{font-size:12px;text-transform:uppercase;border:0;color:var(--mu)}
td{border:0;background:var(--bg);padding:11px 6px}
td:first-child{border-radius:12px 0 0 12px;font-weight:700}
td:last-child{border-radius:0 12px 12px 0;font-weight:800}
td.n{font-weight:600}
tr.first td{color:var(--tx);background:var(--soft)}
.zg td:first-child{box-shadow:none;background:#86efac;color:#052e16}
.zr td:first-child{box-shadow:none;background:#fca5a5;color:#450a0a}
/* matches */
.rd{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:3px 12px;font-size:12px;margin:16px 0 8px}
.m{background:var(--bg);border:0;border-radius:18px;padding:12px;margin-bottom:8px;font-weight:600}
.m:last-child{border:0}
.sc input{width:48px;height:44px;font-size:20px;font-weight:800;border:2px solid transparent;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.sc input:focus{outline:0;border-color:var(--ac)}
.m span.w{color:var(--ac)}
.mm{border:0}
/* live */
.lvc{border:0;background:linear-gradient(135deg,#e11d48,#9f1239);color:#fff;border-radius:20px;box-shadow:0 10px 26px rgba(225,29,72,.4)}
.lvdot,.lvh{color:#fff}
.lvdot::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:lvp 1s infinite}
@keyframes lvp{50%{opacity:.2}}
.lvs .ls{font-size:46px;letter-spacing:2px}
.lvb{border-radius:18px;font-size:24px}
.lvs{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)!important}.lvs .ls{white-space:nowrap;font-size:36px!important;letter-spacing:0!important}.lvs .lcd{font-size:13px;min-height:18px;margin-top:2px}

/* ===== NEO skin v3 ===== */
:root{--bg:#f1f3ff;--card:#fff;--bd:#e4e8f6;--tx:#0e1330;--mu:#6a7396;--ac:#10b981;--soft:#e9eeff;--sh:0 10px 30px rgba(40,55,130,.10);--g:linear-gradient(135deg,#10b981,#06b6d4);--g2:linear-gradient(140deg,#4f46e5,#7c3aed 48%,#0ea5e9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a16;--card:#0e1630;--bd:#1c2748;--tx:#eef2ff;--mu:#8d98bb;--ac:#34d399;--soft:#18234a;--sh:0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#060a16;--card:#0e1630;--bd:#1c2748;--tx:#eef2ff;--mu:#8d98bb;--ac:#34d399;--soft:#18234a;--sh:0 10px 30px rgba(0,0,0,.5)}
:root[data-theme="light"]{--bg:#f1f3ff;--card:#fff;--bd:#e4e8f6;--tx:#0e1330;--mu:#6a7396;--ac:#10b981;--soft:#e9eeff;--sh:0 10px 30px rgba(40,55,130,.10)}
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(800px 480px at 8% -8%,rgba(99,102,241,.20),transparent 60%),radial-gradient(640px 460px at 100% 2%,rgba(16,185,129,.16),transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
#app{max-width:680px}
h1{font-size:23px;font-weight:800;letter-spacing:-.2px}
h2{font-size:16px;font-weight:700}
@keyframes nup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card,.tile,.tcard,.hero,.m,.lvc,.nfc,.champ{animation:nup .45s cubic-bezier(.2,.8,.2,1) both}
.tiles .tile:nth-child(2){animation-delay:.04s}.tiles .tile:nth-child(3){animation-delay:.08s}.tiles .tile:nth-child(4){animation-delay:.12s}.tiles .tile:nth-child(5){animation-delay:.16s}.tiles .tile:nth-child(6){animation-delay:.2s}.tiles .tile:nth-child(7){animation-delay:.24s}
/* surfaces */
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:18px;box-shadow:var(--sh)}
/* buttons */
button{border-radius:999px;background:var(--soft);color:var(--tx);font-weight:600;padding:10px 16px;transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{filter:brightness(1.04)}button:active{transform:scale(.95)}
button.pri,button.on{background:var(--g);color:#fff;box-shadow:0 8px 20px rgba(16,185,129,.35)}
.big{border-radius:18px;padding:15px;font-size:16px;font-weight:700;background:var(--g);color:#fff;box-shadow:0 10px 24px rgba(6,182,212,.30)}
.seg,.tabs{background:var(--soft);border-radius:999px;padding:4px}
.seg button,.tabs button{border-radius:999px;background:transparent;box-shadow:none}
.seg button.on,.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 3px 10px rgba(0,0,0,.15)}
/* inputs */
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--soft);border:2px solid transparent;border-radius:16px;color:var(--tx);font:inherit;padding:12px 14px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}
.sc input{background:var(--card);border-radius:16px;box-shadow:var(--sh);font-weight:800}
/* chips */
.chip{background:var(--soft);border-radius:999px;font-weight:600}
.dv button,.chipsr button,.pgc button{border-radius:999px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--bd)}
.dv button.on,.chipsr button.on,.pgc button.on{background:var(--g);color:#fff;border-color:transparent}
/* hero */
.hero{background:var(--g2);border-radius:30px;padding:24px 20px 18px;box-shadow:0 18px 40px rgba(79,70,229,.38);border:0}
.hero::before{content:"";position:absolute;width:220px;height:220px;right:-70px;bottom:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)}
.hero::after{content:"";position:absolute;width:160px;height:160px;left:-60px;top:-70px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.45),transparent 70%)}
.hero>*{position:relative;z-index:1}.hero .hs{z-index:0}
.hh{font-size:14px;opacity:.9}.hn{font-size:30px;font-weight:900;letter-spacing:1.5px}
.stats div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);border-radius:18px}
.thm{position:absolute!important;right:14px;top:14px;z-index:2;width:42px;height:42px;padding:0!important;border-radius:50%!important;background:rgba(255,255,255,.2)!important;color:#fff!important;font-size:18px;backdrop-filter:blur(8px);box-shadow:none!important}
/* tiles */
.sec{font-size:15px;font-weight:800;margin:20px 4px 10px;display:flex;align-items:center;gap:8px}
.tile,.tcard{border:1px solid var(--bd);border-radius:24px;background:var(--card);box-shadow:var(--sh)}
.tile{padding:16px;transition:transform .2s,box-shadow .2s}.tile:active{transform:scale(.97)}
.tile .ic{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--soft);font-size:24px;margin-bottom:4px}
.tiles .tile:nth-child(1) .ic{background:linear-gradient(135deg,#fde68a,#fbbf24)}.tiles .tile:nth-child(2) .ic{background:linear-gradient(135deg,#bfdbfe,#60a5fa)}.tiles .tile:nth-child(3) .ic{background:linear-gradient(135deg,#ddd6fe,#a78bfa)}.tiles .tile:nth-child(4) .ic{background:linear-gradient(135deg,#fecdd3,#fb7185)}.tiles .tile:nth-child(5) .ic{background:linear-gradient(135deg,#a7f3d0,#34d399)}.tiles .tile:nth-child(6) .ic{background:linear-gradient(135deg,#bae6fd,#38bdf8)}.tiles .tile:nth-child(7) .ic{background:linear-gradient(135deg,#fed7aa,#fb923c)}
.tile b{font-size:15px;font-weight:800}
.tcard.act{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac),var(--sh)}
.bd{border-radius:999px;font-weight:700}
/* tables */
table{border-collapse:separate;border-spacing:0 6px}
th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--mu);border:0;font-weight:700}
td{background:var(--soft);border:0;padding:11px 6px}
td:first-child{border-radius:16px 0 0 16px;font-weight:800}td:last-child{border-radius:0 16px 16px 0;font-weight:800}
tr.first td{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 24%,var(--card)),var(--soft));color:var(--tx)}
/* matches */
.m{background:var(--soft);border:0;border-radius:22px;padding:14px 12px;margin-bottom:10px;font-weight:700}
.rd{background:var(--g);color:#fff;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:700}
/* live */
.lvc{background:linear-gradient(135deg,#f43f5e,#be123c);border-radius:24px;box-shadow:0 14px 30px rgba(244,63,94,.40)}
.lvs .ls{font-weight:900}
.lvb{border-radius:22px}
/* news/pages */
.pgt{background:var(--soft);border-radius:999px;padding:4px;gap:4px;position:sticky;top:6px;z-index:5;backdrop-filter:blur(10px)}
.pgt button{border-radius:999px;background:transparent;border:0;box-shadow:none}
.pgt button.on{background:var(--g);color:#fff}
.sbar{background:var(--soft);border-radius:999px;padding:6px 8px 6px 12px}
/* nav */
#nav{left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border:1px solid var(--bd);border-radius:999px;padding:6px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 16px 40px rgba(0,0,0,.28);max-width:560px;margin:0 auto}
#nav button{border-radius:999px;padding:6px 2px;font-weight:700}
#nav button.on{background:var(--g);color:#fff}
#nav .ic{font-size:20px}
/* overlays as sheets */
.ov.tl{background:rgba(5,8,22,.62);backdrop-filter:blur(8px);align-items:flex-end;padding:0}

<script>
const $=s=>document.querySelector(s);

const fresh=()=>({mode:'',divs:[nd(0,'tour')],cur:0});
let LIB=null,S;
try{LIB=JSON.parse(localStorage.getItem('tm6'))}catch(e){}

if(!LIB.items.some(x=>x.id===LIB.act))LIB.act=LIB.items[0].id;

function RS(){try{return JSON.parse(localStorage.getItem('tmroster'))||{}}catch(e){return{}}}
function rsSync(){const o=RS();let ch=0;S.divs.forEach(d=>d.players.forEach(n=>{const had=n in o,e=o[n]||{},inf=(S.info||{})[n]||{},l=A(d.lg).find(x=>x.n===n),ne=Object.assign({},e,inf);if(l&&!JPG.test(l.l))ne.l=l.l;if(!had||JSON.stringify(ne)!==JSON.stringify(e)){o[n]=ne;ch=1}}));if(ch)localStorage.setItem('tmroster',JSON.stringify(o))}
function rsList(){const o=RS();return Object.keys(o).filter(n=>!S.divs.some(x=>x.players.concat(x.inc).some(p=>p.toLowerCase()===n.toLowerCase())))}
function rsAdd1(n){const o=RS()[n]||{},inf={};for(const k in o)if(k!=='l')inf[k]=o[k];if(addPl(n,inf)&&o.l)addLg(D(),n,o.l)}
function rsAdd(i){const n=rsList()[i];if(n)rsAdd1(n);R()}

function rsDel(i){const n=rsList()[i],o=RS();if(n){delete o[n];localStorage.setItem('tmroster',JSON.stringify(o))}R()}
function rsV(){const l=rsList();if(!l.length)return'';return`<p class="mu"><b>💡 আগের প্লেয়ার (ট্যাপ করে যোগ করুন)</b></p><div class="chips">${l.map((n,i)=>`<span class="chip" onclick="rsAdd(${i})" style="cursor:pointer">+ ${esc(n)}<b onclick="event.stopPropagation();rsDel(${i})">×</b></span>`).join('')}</div><button class="big" style="margin-top:10px" onclick="rsAll()">সবাইকে যোগ করুন</button>`}
function save(){try{rsSync()}catch(e){}try{careerSync()}catch(e){}try{const it=LIB.items.find(x=>x.id===LIB.act);if(it)it.s=S;localStorage.setItem('tm6',JSON.stringify(LIB))}catch(e){}if(S.share&&S.share.role==='admin'&&!_np)sched()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function add(){const el=$('#nm'),v=el.value.trim(),P=D().players;if(!v||S.divs.some(d=>d.players.concat(d.inc).some(p=>p.toLowerCase()===v.toLowerCase()))){el.focus();return}P.push(v);if(PPH){const dd=D();dd.ph=dd.ph||{};dd.ph[v]=PPH;PPH=''}if(tkSet(1).has(PLG))PLG=rl();addLg(D(),v,PLG);PLG=rl();R();$('#nm').focus()}
function del(i){const d=D(),n=d.players[i];if(d.ph)delete d.ph[n];d.players.splice(i,1);d.lg=A(d.lg).filter(x=>x.n!==n);R()}
function setFmt(f){D().fmt=f;R()}
function setName(v){D().name=v.trim()||D().name;R()}
function setZ(f,v){D()[f]=Math.max(0,parseInt(v)||0);R()}
function selDiv(i){S.cur=i;R()}
function addDiv(){if(S.mode==='cl'){if(S.divs.length-1>=4)return;const nm=QN.find(n=>!S.divs.some(d=>d.name===n));S.divs.splice(S.divs.length-1,0,qd(S.divs.length-1,nm));S.cur=S.divs.length-2}else{S.divs.push(nd(S.divs.length,S.mode));S.cur=S.divs.length-1}R()}
function delDiv(){if(S.divs.length<2||D().st||(S.mode==='cl'&&(S.cur===S.divs.length-1||S.divs.length<3)))return;S.divs.splice(S.cur,1);S.cur=0;R()}
function size(n){let s=2;while(s<n)s*=2;return s}
function genLeague(p){let t=p.slice();if(t.length%2)t.push(null);const n=t.length,m=[];
for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)m.push({r:r+1,a,b,sa:'',sb:''})}t.splice(1,0,t.pop())}return m}
function seedOrder(sz){let a=[1];while(a.length<sz){const n=a.length*2;a=a.flatMap(s=>[s,n+1-s])}return a}
function genKO(list){const n=list.length,sz=size(n),o=seedOrder(sz).map(s=>s<=n?list[s-1]:'BYE'),rounds=[];
const mk=()=>({l1a:'',l1b:'',l2a:'',l2b:'',pw:''});
const r0=[];for(let i=0;i<sz/2;i++){r0.push({a:o[2*i],b:o[2*i+1],...mk()})}rounds.push(r0);
for(let c=sz/4;c>=1;c/=2)rounds.push(Array.from({length:c},mk));return rounds}
function initDiv(d,p){d.players=p;d.league=[];d.ko=[];d.po=false;d.dt={};d.tab='ko';d.q=d.sty==='uefa'&&d.fmt==='lk'?Math.max(2,Math.ceil(p.length*2/3)):p.length;if(d.fmt==='ko')d.ko=genKO(shuffle(p));else d.league=lgGen(d,p)}
function start(){const d=D();initDiv(d,d.players);d.st=true;nws('🏆 '+TNM()+' শুরু! '+d.players.length+' জন অংশ নিচ্ছে: '+d.players.join(', '),'🏆');if(S.mode!=='cl'){d.season=1;d.hist=[]}R()}
function startKO(){const d=D();d.ko=genKO(table().slice(0,d.q||d.players.length).map(x=>x.p));d.tab='ko';nws('⚔️ নকআউট পর্ব শুরু! লড়বে: '+table().slice(0,d.q||d.players.length).map(x=>x.p).join(', '),'⚔️');R()}
function reset(){const d=D();d.news=[];d.nr=[];d.cnw='';d.st=false;d.po=false;d.dt={};d.league=[];d.ko=[];d.ended=false;d.res=null;R()}
function num(v){return v===''?'':Math.max(0,parseInt(v)||0)}
function setL(i,f,v){D().league[i][f]=num(v);dirty=true;save();chkSoon()}
function setK(r,i,f,v){D().ko[r][i][f]=f==='pw'?v:num(v);if(f!=='pw'){D().ko[r][i].pw='';dirty=true;save();chkSoon()}else R()}
function adv(el){if(el.value==='')return;const all=[...document.querySelectorAll('#app .sc input')],n=all[all.indexOf(el)+1];if(n){n.focus();try{n.select()}catch(e){}}else el.blur()}
function setQ(v){D().q=+v;R()}
function setTab(t){D().tab=t;R()}
function table(){const d=D(),t={};d.players.forEach(p=>t[p]={p,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
d.league.forEach(m=>{if(m.sa===''||m.sb==='')return;const a=t[m.a],b=t[m.b];a.P++;b.P++;a.GF+=m.sa;a.GA+=m.sb;b.GF+=m.sb;b.GA+=m.sa;
if(m.sa>m.sb){a.W++;b.L++;a.Pts+=3}else if(m.sa<m.sb){b.W++;a.L++;b.Pts+=3}else{a.D++;b.D++;a.Pts++;b.Pts++}});
return Object.values(t).sort((x,y)=>y.Pts-x.Pts||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF||x.p.localeCompare(y.p))}
const legs=r=>D().po?2:D().ko[r].length===1?1:2;
function teams(r,i){if(r===0){const m=D().ko[0][i];return[m.a,m.b]}return[win(r-1,2*i),win(r-1,2*i+1)]}
function done(m,L){return L===2?[m.l1a,m.l1b,m.l2a,m.l2b].every(x=>x!==''):m.l1a!==''&&m.l1b!==''}
function agg(m,L){return[m.l1a+(L===2?m.l2a:0),m.l1b+(L===2?m.l2b:0)]}
function win(r,i){const[a,b]=teams(r,i),m=D().ko[r][i],L=legs(r);
if(a==='BYE'&&b==='BYE')return'BYE';if(a==='BYE')return b;if(b==='BYE')return a;
if(!a||!b||!done(m,L))return null;const[x,y]=agg(m,L);
if(x>y)return a;if(y>x)return b;return m.pw==='a'?a:m.pw==='b'?b:null}
function rname(r){const d=D(),K=d.ko[r],t=K.length*2;if(d.po)return'কোয়ালিফাইং প্লে-অফ (২ লেগ)';if(d.sty==='uefa'&&r===0&&K.some(m=>m.a==='BYE'||m.b==='BYE'))return'প্লে-অফ রাউন্ড (২ লেগ)';return t===2?'ফাইনাল (১ লেগ)':t===4?'সেমিফাইনাল (২ লেগ)':t===8?'কোয়ার্টার ফাইনাল (২ লেগ)':`রাউন্ড অব ${t} (২ লেগ)`}
function champ(){const d=D();if(S.mode==='cl'&&S.cur<S.divs.length-1)return null;if(d.fmt==='league')return d.league.length&&leagueDone()?table()[0].p:null;
if(!d.ko.length)return null;const w=win(d.ko.length-1,0);return w&&w!=='BYE'?w:null}
const banner=n=>`<div class="champ">🏆 চ্যাম্পিয়ন: ${esc(n)}${D().prize?`<div style="font-size:15px;font-weight:600;margin-top:4px">🎁 প্রাইজ: ${esc(D().prize)}</div>`:''}<button data-ok onclick="replay()">🎉 আবার দেখুন</button></div>`;
function celKey(){const n=champ();return n?S.cur+'|'+D().season+'|'+n:''}
function overlay(){const d=D(),n=champ();if(!n||d.cel===celKey())return'';
if(!window._chL){window._chL=1;setTimeout(chLoop,30)}
return`<div class="ov chn"><canvas id="chcv2"></canvas><div class="cb3"><div class="c1">✨ চ্যাম্পিয়ন ✨</div><div class="tr3">🏆</div><div class="n3">${esc(n)}</div><p class="c3">${S.mode==='div'?esc(d.name)+' · সিজন '+d.season+' চ্যাম্পিয়ন':S.mode==='cl'?'চ্যাম্পিয়নস লিগ চ্যাম্পিয়ন':'টুর্নামেন্ট চ্যাম্পিয়ন'}</p>${d.prize?`<div class="c4">🎁 প্রাইজ: ${esc(d.prize)}</div>`:''}<button class="pri big" style="margin-top:18px;max-width:280px" data-ok onclick="closeCel()">ঠিক আছে</button></div></div>`}

function chLoop(){const cv=document.getElementById('chcv2'),tr=document.querySelector('.tr3');if(!cv||!tr){window._chL=0;return}
const W=innerWidth,H=innerHeight;if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
const c=cv.getContext('2d');if(!cv._p)cv._p={fw:[],cf:[],t:0,n:0};const P=cv._p;P.t+=.016;const t=P.t;c.clearRect(0,0,W,H);
const b=tr.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
c.globalCompositeOperation='lighter';c.save();c.translate(cx,cy);c.rotate(t*.25);
for(let i=0;i<14;i++){c.rotate(Math.PI*2/14);c.beginPath();c.moveTo(0,0);c.arc(0,0,Math.max(W,H),-.055,.055);c.closePath();c.fillStyle='rgba(255,196,60,.08)';c.fill()}c.restore();
if(t>P.n){P.n=t+.45+Math.random()*.5;const x=W*(.12+.76*Math.random()),y=H*(.1+.4*Math.random()),col=['255,90,110','255,200,60','90,220,255','160,255,120','200,120,255'][Math.random()*5|0];
for(let i=0;i<48;i++){const a=i*Math.PI*2/48+Math.random()*.1,v=70+Math.random()*120;P.fw.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1.4,col})}}
P.fw=P.fw.filter(p=>{p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy+=110*.016;p.vx*=.99;p.l-=.016;if(p.l<=0)return false;c.fillStyle='rgba('+p.col+','+(p.l/1.4)+')';c.beginPath();c.arc(p.x,p.y,2.6,0,7);c.fill();return true});
c.globalCompositeOperation='source-over';
while(P.cf.length<80)P.cf.push({x:Math.random()*W,y:-10-Math.random()*H*.6,vy:90+Math.random()*100,ph:Math.random()*9,r:Math.random()*6,w:6+Math.random()*6,col:['#f43f5e','#fbbf24','#22c55e','#3b82f6','#a855f7','#fff'][Math.random()*6|0]});
P.cf.forEach(p=>{p.y+=p.vy*.016;p.r+=.1;const x=p.x+Math.sin(t*2+p.ph)*24;if(p.y>H+20){p.y=-12;p.x=Math.random()*W}c.save();c.translate(x,p.y);c.rotate(p.r);c.scale(1,Math.abs(Math.cos(p.r*.7))+.15);c.fillStyle=p.col;c.fillRect(-p.w/2,-p.w/1.2,p.w,p.w*1.6);c.restore()});
requestAnimationFrame(chLoop)}

৫. সময়মতো ম্যাচ না খেললে অ্যাডমিন সিদ্ধান্ত নেবে (যেমন ৩-০ ওয়াকওভার)।
৬. নেট বা ডিভাইসের সমস্যায় ডিসকানেক্ট হলে ম্যাচ আবার খেলা হবে। ইচ্ছাকৃতভাবে বারবার ডিসকানেক্ট করলে অ্যাডমিন শাস্তি দিতে পারবে।
